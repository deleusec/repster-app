# Splash screen config — generated by `dart run flutter_native_splash:create`.
# Mirrors the PWA's SplashScreen.tsx (background #0a0a0a, wordmark logo).
# See https://pub.dev/packages/flutter_native_splash for the full reference.

flutter_native_splash:
  # Background matches the PWA's manifest.background_color.
  color: "#0a0a0a"
  color_dark: "#0a0a0a"

  # iOS, Android <12, web: full wordmark logo (matches the PWA splash).
  image: assets/splash/logo_wordmark.png
  image_dark: assets/splash/logo_wordmark.png

  # Android 12+ uses a system splash with an icon inside a circular mask.
  # A wordmark would get cropped — use the square monogram instead.
  android_12:
    color: "#0a0a0a"
    color_dark: "#0a0a0a"
    image: assets/splash/logo_square.png
    image_dark: assets/splash/logo_square.png

  # web/index.html is hand-written (safe-area probe, PWA-style splash):
  # the generator must not overwrite it.
  web: false
  ios: true
  android: true

  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
