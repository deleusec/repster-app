name: repster
description: "Repster — carnet de bord pour séances de musculation"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.10.7

dependencies:
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.4
  go_router: ^14.8.1
  heroicons: ^0.11.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  lucide_icons_flutter: ^3.1.14
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  supabase_flutter: ^2.12.4
  timezone: ^0.11.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.5
  slang_build_runner: ^4.18.0
  very_good_analysis: ^7.0.0

# App launcher icon — generate with: dart run flutter_launcher_icons
# Source is the Repster brand mark (black rounded square + white "R"),
# rendered from assets/images/repster_logo_square.svg.
flutter_launcher_icons:
  image_path: "assets/launcher/repster_icon.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/launcher/repster_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/repster_icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  # Bundled Manrope (same family as the PWA), so text renders identically
  # offline and with no fetch/flash — see lib/core/theme/app_theme.dart.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
