<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Repster — carnet de bord pour séances de musculation">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Installed on iOS, the page runs under the status bar. This only works
       together with viewport-fit=cover, which the script below keeps alive. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Repster">
  <meta name="theme-color" content="#010101">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Repster</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style id="splash-screen-style">
    html {
      height: 100%;
      /* iOS tints the status bar from this colour; without it the page
         behind the app is white. */
      background-color: #010101;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      background-color: #010101;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Installed on iOS under a translucent status bar, WebKit lays the page
       out shorter than the screen by the bar's height and leaves a band at
       the bottom. The large viewport unit still spans the whole screen. */
    /* The root has to be that tall too: WebKit only paints as far down as
       the document goes, and fixed boxes do not extend it. */
    html.ios-standalone {
      height: 100lvh;
    }

    html.ios-standalone body,
    html.ios-standalone #splash {
      height: 100lvh !important;
      bottom: auto !important;
    }

    /* Measures env(safe-area-inset-*) so Flutter, which does not read it,
       can pad the UI itself. Never visible. */
    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    /* Boot splash: the mark fades and settles in, then the whole veil fades
       out once Flutter has painted its first frame. Same choreography as
       the PWA's SplashScreen. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #010101;
      opacity: 1;
      transition: opacity 500ms ease;
    }

    #splash.is-fading {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 80px;
      height: 57px;
      animation: splash-logo 700ms ease forwards;
    }

    @keyframes splash-logo {
      from {
        opacity: 0;
        transform: scale(0.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
      #splash { transition: none; }
    }
  </style>

  <script id="splash-screen-script">
    // Flutter's engine removes the viewport meta at startup and writes its
    // own, without viewport-fit=cover. Without it iOS lays the page out
    // inside the safe area while the translucent status bar still expects it
    // underneath: env() reads zero, the top is clipped and taps land off by
    // the bar's height. Put it back whenever a viewport meta appears.
    function keepViewportCover() {
      var metas = document.head.querySelectorAll('meta[name="viewport"]');
      for (var i = 0; i < metas.length; i++) {
        if (metas[i].content.indexOf("viewport-fit") === -1) {
          metas[i].content += ", viewport-fit=cover";
        }
      }
    }
    new MutationObserver(keepViewportCover).observe(document.head, { childList: true });

    // Same WebKit bug, engine side: on iOS Flutter sizes itself from
    // documentElement.clientHeight, which comes back short. Report the body's
    // height instead (100lvh, see the style above) when it is taller.
    if (window.navigator.standalone === true) {
      var root = document.documentElement;
      root.classList.add("ios-standalone");
      var nativeHeight = Object.getOwnPropertyDescriptor(Element.prototype, "clientHeight");
      if (nativeHeight && nativeHeight.get) {
        Object.defineProperty(root, "clientHeight", {
          configurable: true,
          get: function () {
            var layout = nativeHeight.get.call(this);
            var full = document.body ? Math.round(document.body.getBoundingClientRect().height) : 0;
            return full > layout ? full : layout;
          },
        });
      }
    }

    // Safe-area insets in CSS pixels, [top, right, bottom, left], read by the
    // app on every layout (see lib/core/web/safe_area_web.dart).
    window.repsterSafeArea = function () {
      var probe = document.getElementById("safe-area-probe");
      if (!probe) return [0, 0, 0, 0];
      var cs = getComputedStyle(probe);
      return [
        parseFloat(cs.paddingTop) || 0,
        parseFloat(cs.paddingRight) || 0,
        parseFloat(cs.paddingBottom) || 0,
        parseFloat(cs.paddingLeft) || 0,
      ];
    };

    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("is-fading");
      setTimeout(function () { splash.remove(); }, 550);
    }

    // The app removes the splash itself once its first screen is ready
    // (FlutterNativeSplash.remove). These are the safety nets: the first
    // painted frame, or a hard cap, so a stalled boot never hides behind the
    // veil.
    window.addEventListener("flutter-first-frame", function () {
      setTimeout(removeSplashFromWeb, 150);
    });
    setTimeout(removeSplashFromWeb, 8000);
  </script>
</head>
<body>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <div id="splash" aria-hidden="true">
    <img src="splash/repster_logo.svg" alt="">
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
