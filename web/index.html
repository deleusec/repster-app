<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Repster — carnet de bord pour séances de musculation">

  <!--
    Installed on iOS, the page runs under the status bar (black-translucent +
    viewport-fit=cover) instead of below a black band; the app pads its own
    content by the insets measured below. iOS reads this meta when the icon
    is pinned, never after: an icon pinned under the old "black" value keeps
    an opaque bar, a page 47 pt shorter than the screen, and taps offset by
    that much. Re-pin the app after changing it.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Repster">
  <meta name="theme-color" content="#010101">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Repster</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style id="splash-screen-style">
    html {
      height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      background-color: #010101;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Measures env(safe-area-inset-*) so Flutter, which does not read it,
       can pad the UI itself. Never visible. */
    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    /* Boot splash: the mark fades and settles in, then the whole veil fades
       out once Flutter has painted its first frame. Same choreography as
       the PWA's SplashScreen. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #010101;
      opacity: 1;
      transition: opacity 500ms ease;
    }

    #splash.is-fading {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 80px;
      height: 57px;
      animation: splash-logo 700ms ease forwards;
    }

    @keyframes splash-logo {
      from {
        opacity: 0;
        transform: scale(0.88);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
      #splash { transition: none; }
    }
  </style>

  <script id="splash-screen-script">
    // Safe-area insets in CSS pixels, read by the app at startup and on every
    // layout change (see lib/core/web/safe_area_web.dart).
    //
    // env(safe-area-inset-*) is the source when WebKit fills it in. A pinned
    // iOS app has been seen reporting zeros while still running edge to edge
    // at the bottom, so when every value is zero the insets are inferred from
    // the screen instead: the status bar height on iPhones with a notch or
    // Dynamic Island is 47 (844/926 pt tall) or 59 (852/932 pt), the home
    // indicator takes 34, and both only apply to the part of the screen the
    // page actually covers.
    var standalone = window.navigator.standalone === true;
    window.repsterSafeAreaSource = "env";
    window.repsterSafeArea = function () {
      var probe = document.getElementById("safe-area-probe");
      var env = [0, 0, 0, 0];
      if (probe) {
        var cs = getComputedStyle(probe);
        env = [
          parseFloat(cs.paddingTop) || 0,
          parseFloat(cs.paddingRight) || 0,
          parseFloat(cs.paddingBottom) || 0,
          parseFloat(cs.paddingLeft) || 0,
        ];
      }
      if (env[0] || env[1] || env[2] || env[3] || !standalone) {
        window.repsterSafeAreaSource = "env";
        return env;
      }
      var sh = screen.height, sw = screen.width;
      var portrait = window.innerHeight >= window.innerWidth;
      var tall = Math.max(sh, sw);
      var notch = tall >= 780;
      if (!notch || !portrait) {
        window.repsterSafeAreaSource = "guess-flat";
        return [0, 0, 0, 0];
      }
      var bar = (tall === 852 || tall === 932 || tall === 874 || tall === 956) ? 59 : 47;
      var coversTop = window.innerHeight >= sh - 1;
      window.repsterSafeAreaSource = coversTop ? "guess-full" : "guess-below-bar";
      return [coversTop ? bar : 0, 0, 34, 0];
    };

    // Everything the app needs to know about the host it runs in, as one
    // string the settings footer can show on a real phone.
    window.repsterDiag = function () {
      var sa = window.repsterSafeArea();
      var meta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      return [
        "shell=2",
        "standalone=" + (window.navigator.standalone === true ? 1 : 0),
        "display=" + (window.matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser"),
        "insets=" + sa.join("/") + "(" + window.repsterSafeAreaSource + ")",
        "bar=" + (meta ? meta.content : "none"),
        "win=" + window.innerWidth + "x" + window.innerHeight,
        "screen=" + screen.width + "x" + screen.height,
        "dpr=" + window.devicePixelRatio,
      ].join(" ");
    };

    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("is-fading");
      setTimeout(function () { splash.remove(); }, 550);
      document.body.style.background = "transparent";
    }

    // The app removes the splash itself once its first screen is ready
    // (FlutterNativeSplash.remove). These are the safety nets: the first
    // painted frame, or a hard cap, so a stalled boot never hides behind the
    // veil.
    window.addEventListener("flutter-first-frame", function () {
      setTimeout(removeSplashFromWeb, 150);
    });
    setTimeout(removeSplashFromWeb, 8000);
  </script>
</head>
<body>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <div id="splash" aria-hidden="true">
    <img src="splash/repster_logo.svg" alt="">
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
